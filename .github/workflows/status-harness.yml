name: harness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  status-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Status numbers, board drift, doc size budgets, control characters
        run: python scripts/status.py --check
      - name: Ruff (pinned to uv.lock)
        run: |
          set -euo pipefail
          pip install ruff==0.16.10
          ruff format --check src tests scripts/affected_tests.py scripts/status.py
          ruff check src tests scripts/affected_tests.py scripts/status.py
