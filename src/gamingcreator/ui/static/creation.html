<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>模板创作 · 游戏创作工作台</title><link rel="stylesheet" href="/assets/creation.css"><script src="/assets/creation.js" defer></script></head>
<body><header><a href="/">← 素材工作台</a><h1>从已有素材创作视频</h1><p>本地离线模板 · 不产生新分析费用。方案与脚本为描述草稿，尚未人评。</p></header><main>
<p id="notice" role="status" aria-live="polite">正在读取项目…</p>
<section><h2>1. 选择素材与需求</h2><label>已有项目<select id="project"><option value="">请选择项目</option></select></label><fieldset><legend>选择已完成分析的录像（可多选）</legend><div id="runs"></div></fieldset>
<form id="brief"><div class="fields">
<label>游戏<input name="game" required maxlength="500"></label><label>内容类型（模板目标）<select name="contentType" required><option value="feature_showcase">玩法展示</option><option value="guide">攻略</option><option value="campaign">活动投稿</option></select></label><label>发布平台<select name="platforms" required><option value="bilibili">B站</option><option value="douyin">抖音</option><option value="kuaishou">快手</option><option value="xiaohongshu">小红书</option></select></label><label>目标秒数<input name="targetDuration" type="number" min="1" max="86400" step="1" value="30" required></label><label>创作目标<input name="objective" required value="整理已有素材中的玩法片段"></label><label>目标观众<input name="audience" required value="新玩家"></label><label>表达语气<input name="tone" required value="清楚简洁"></label><label>必须主题（逗号或换行分隔）<textarea name="mandatoryTopics" rows="2"></textarea></label><label>排除项（逗号或换行分隔）<textarea name="exclude" rows="2"></textarea></label></div><label>输出帧率<input id="fps" type="number" min="1" max="120" step="1" value="30" required></label><button id="plan" disabled>生成三种模板方案</button></form></section>
<section><h2>2. 查看方案，明确选择</h2><p>片段按模板创作顺序排列；主题文字命中不证明画面理解。缺口方案不可渲染。</p><div id="plans" class="plans"></div><form id="render-form"><label>成片尺寸<select id="size"><option value="1280,720">横屏 1280 × 720</option><option value="720,1280">竖屏 720 × 1280</option></select></label><button id="render" disabled>将所选方案生成视频</button></form></section>
<section><h2>3. 任务与成片</h2><p id="job-status" aria-live="polite">尚未选择任务</p><div id="artifact"></div><h3>此项目最近任务</h3><p>最多显示最近 100 项；更早记录可能未列出。刷新只回查任务，不重新生成。</p><button id="refresh" type="button">刷新历史</button><div id="history"></div></section>
</main></body></html>
