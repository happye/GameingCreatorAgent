<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>编辑代理空间</title>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/assets/proxy-space.css">
    <script src="/assets/proxy-space.js" defer></script>
</head>
<body class="proxy-space-page">
    <header class="app-header">
        <div class="brand-copy"><h1>代理空间清单</h1></div>
        <a class="button secondary compact" href="/studio">返回 Studio</a>
    </header>
    <main class="proxy-space-main">
        <p id="inventory-notice" class="proxy-space-notice">只读盘点，未删除。</p>
        <p>编辑代理可从原片重新生成。选中一条并确认后，就可释放该代理占用的空间。</p>
        <p>共 <strong id="total-count">—</strong> 条，合计 <strong id="total-bytes">—</strong> 字节。有效 <span id="count-valid">—</span>，缺件 <span id="count-missing">—</span>，坏回执 <span id="count-bad_receipt">—</span>，活动构建 <span id="count-building">—</span>。</p>
        <p class="proxy-space-downloads">
            <a href="/api/proxy-space.json">下载 JSON</a>
            <a href="/api/proxy-space.csv">下载 CSV</a>
        </p>
        <p id="inventory-result" class="notice" role="status" hidden></p>
        <p id="inventory-error" class="notice" role="alert" hidden></p>
        <table id="inventory-table">
            <thead>
                <tr>
                    <th>来源哈希</th>
                    <th>字节</th>
                    <th>状态</th>
                    <th>原因</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <dialog id="reclaim-dialog" aria-labelledby="reclaim-title">
            <h2 id="reclaim-title">回收这一条编辑代理</h2>
            <p>来源 <code id="reclaim-source"></code></p>
            <p>代理占用 <strong id="reclaim-bytes"></strong> 字节。</p>
            <div class="proxy-space-downloads">
                <button id="reclaim-cancel" class="button secondary compact" type="button">取消</button>
                <button id="reclaim-confirm" class="button primary compact" type="button">确认回收</button>
            </div>
        </dialog>
    </main>
</body>
</html>
