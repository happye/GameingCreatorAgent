[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "gamingcreator"
version = "0.1.0"
description = "Local game-footage analysis and semantic clip retrieval"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1", "ctranslate2==4.8.2", "av==16.1.0", "onnxruntime==1.30.0"]
retrieval = ["onnxruntime==1.30.0", "numpy==2.5.3", "tokenizers==0.23.2"]
ui-test = ["playwright==1.63.0"]

[project.scripts]
gamingcreator = "gamingcreator.cli.main:main"

[dependency-groups]
dev = ["hatchling==1.32.4", "pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gamingcreator"]

[tool.hatch.build.targets.sdist]
include = ["src/gamingcreator", "pyproject.toml", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.cache/pytest-tmp-run"
cache_dir = ".cache/pytest-cache"
markers = [
  "media: integration tests using project-local FFmpeg/ffprobe",
  "browser: auto-applied when the module uses Playwright (Chromium)",
  "local_data: auto-applied when the module reads ignored artifacts/ or GameVideos/ data",
  "ffmpeg: auto-applied when the module mentions ffmpeg/ffprobe",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 60

# Existing complexity debt (2026-11-01 ratchet): new code must stay under the limits;
# remove a file from this list once it is split.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C901", "PLR0915"]
"scripts/*" = ["C901", "PLR0915"]
